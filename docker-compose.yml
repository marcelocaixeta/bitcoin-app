services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitcoin_frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      WDS_SOCKET_PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: http://localhost:8000/api
    stdin_open: true
    tty: true

volumes:
  frontend_node_modules:
